id: "core.installer"
name: "Skill 安装器"
version: "1.3.0"
api_version: "1.3"
author: "StarUp"
license: "MIT"
description: "处理 Skill 的安装、卸载和依赖管理"
type: "system"
runtime:
  type: "javascript"
  entry: "index.js"
permissions:
  - id: "fs.write"
    scope: ["~/.starup/skills/*", "~/.starup/skilldb/*", "~/.starup/db/*"]
  - id: "network.fetch"
    scope:
      allow: ["https://hub.startup.ai/*", "https://*.github.com/*"]
      deny: []
  - id: "skill.runtime.manage"
    scope: ["load", "unload", "reload"]
  - id: "prompt.layer.modify"
    scope: ["L5"]
  - id: "intent.router.register"
    scope: ["dynamic"]
