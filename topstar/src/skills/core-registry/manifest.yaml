id: "core.registry"
name: "Skill 注册表"
version: "1.3.0"
api_version: "1.3"
author: "StarUp"
license: "MIT"
description: "管理本地 Skill 索引与 Hub 查询"
type: "system"
runtime:
  type: "javascript"
  entry: "index.js"
permissions:
  - id: "network.hub"
    scope:
      allow: ["*"]
      deny: []
  - id: "db.read"
    scope: ["~/.starup/skilldb/*"]
  - id: "db.write"
    scope: ["~/.starup/skilldb/*"]
